# Netlify build config — the Next.js site lives in the website/ subfolder.
# We explicitly declare @netlify/plugin-nextjs so it runs even though the repo
# root is a Python project (auto-detection can miss the Next app in a subdir).
# The plugin sets the correct publish directory and serverless functions — do
# NOT set `publish` manually for Next.js.

[build]
  base = "website"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
