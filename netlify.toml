# Netlify build config — the Next.js site lives in the website/ subfolder and is
# exported as a fully static site (output: "export" in next.config.ts), so there
# is NO framework plugin — Netlify just publishes the generated `out/` folder.
# Security headers are served via website/public/_headers.

[build]
  base = "website"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
