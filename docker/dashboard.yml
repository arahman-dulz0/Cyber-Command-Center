# Docker Compose service for the Cyber Command Center web dashboard (Phase 6).
#
# A read-only FastAPI dashboard over the same PostgreSQL the bot fills. Joins the
# existing docker_cyber-net so it reaches postgres by service name, and publishes
# port 8080 to the LAN (http://192.168.8.185:8080). No new infrastructure.
#
#   docker compose -f docker/dashboard.yml up -d --build
#   docker compose -f docker/dashboard.yml logs -f

services:
  dashboard:
    container_name: cyber-dashboard
    build:
      context: ../services/dashboard
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      TZ: ${TIMEZONE:-Asia/Colombo}
      HOME: /tmp
    # --- Container hardening (read-only, no caps, no privilege escalation) ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m
    ports:
      - "8080:8080"     # LAN-only: reachable at http://<server-ip>:8080
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz',timeout=5).status==200 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "autoheal=true"
    networks:
      - cyber-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cyber-net:
    external: true
    name: docker_cyber-net
